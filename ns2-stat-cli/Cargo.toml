[package]
name = "ns2-stat-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
burn = { version = "0.19.1", default-features = false, features = ["candle", "train", "tui"] }
clap = { version = "4.4", features = ["derive"] }
itertools = "0.14.0"
ns2-stat = { path = "../ns2-stat" }
rand = "0.9.2"
rayon = "1.8"
serde_json = "1.0"
